<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Rock, Paper, Scissors</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-image">
        <img src="./images/logo.svg" alt="">
      </div>
      <div class="score">
        <div class="score-score">
          score
        </div>
        <div class="score-number">
          0
        </div>
      </div>
    </div>


    <div class="body">
      <div class="body-image">
        <img class="triangle" src="./images/bg-triangle.svg" alt="">
        <div class="rock"><img src="./images/icon-rocks.svg" alt=""></div>
        <div class="scissor"><img src="./images/icon-scissors.svg" alt=""></div>
        <div class="paper"><img src="./images/icon-papers.svg" alt=""></div>
      </div>
    </div>

    <div class="rule">
      <div class="close">
        <div class="rule-close">RULES</div>
        <div><img class="close-icon" src="images/icon-close.svg" alt=""></div>
      </div>
      <img src="images/image-rules.svg" alt="">
    </div>

    <div class="rules">
       Rules
    </div>

  </div>

  
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
  <script src="./script.js"></script>
</body>
</html>
